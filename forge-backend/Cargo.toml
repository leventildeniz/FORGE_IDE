[package]
name = "forge-backend"
version = "0.1.0"
edition = "2024"

[dependencies]
warp = "0.3"
tokio = { version = "1", features = ["full"] }
futures-util = "0.3"
rand = "0.8"
ssh-key = { version = "0.4.0", features = ["ed25519", "rand_core"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
home = "0.5" # New: Added for get_suggested_project_roots
russh = "0.40.2"
russh-sftp = "2.3.0"
russh-keys = "0.40.1"
futures = "0.3"
async-trait = "0.1"
rusqlite = { version = "0.40.1", features = ["bundled"] }
portable-pty = "0.8.1"
dashmap = "5.5.3"
uuid = { version = "1.8", features = ["v4"] }
reqwest = { version = "0.12", features = ["json", "stream"] }
scraper = "0.20.0"
html2md = "0.2.14"
urlencoding = "2.1.3"
tokio-util = "0.7"
base64 = "0.23.1"
zip = "8.6.0"
walkdir = "2.5.0"




